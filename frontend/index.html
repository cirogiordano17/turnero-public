<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Turnero | Servicios</title>

  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/landing.css">
</head>
<body>

  <header class="landing-header">
    <div class="landing-header__inner">
      <a href="#inicio" class="brand">Servicios</a>


    </div>
  </header>

  <main id="inicio" class="landing-main">
    <section class="hero">
      <div class="hero__content">
        <h1 class="hero__title">Bienvenido</h1>
        <p class="hero__text">
          Descubrí nuestros servicios especializados diseñados para tu bienestar y transformación.
        </p>
      </div>
    </section>

    <section class="services-section">
      <div class="services-grid">

        <article class="service-card">
          <a class="service-card__link" href="./pelu.html" aria-label="Ir a Peluquería">
            <div class="service-card__image-wrap">
              <img
                src="./img/pelu.jpg"
                alt="Peluquería"
                class="service-card__image"
              />
            </div>

            <div class="service-card__content">
              <div class="service-card__icon" aria-hidden="true">✂</div>

              <div class="service-card__body">
                <h2 class="service-card__title">Peluquería</h2>
                <p class="service-card__description">
                  Estilo y cuidado profesional para tu cabello.
                </p>
                <span class="service-card__cta">Ver más →</span>
              </div>
            </div>
          </a>
        </article>

        <article class="service-card">
          <a class="service-card__link" href="./akashicos/akash.html" aria-label="Ir a Registros Akáshicos">
            <div class="service-card__image-wrap">
              <img
                src="./img/akash.jpg"
                alt="Registros Akáshicos"
                class="service-card__image"
              />
            </div>

            <div class="service-card__content">
              <div class="service-card__icon" aria-hidden="true">✧</div>

              <div class="service-card__body">
                <h2 class="service-card__title">Registros Akáshicos</h2>
                <p class="service-card__description">
                  Conexión espiritual y sanación profunda.
                </p>
                <span class="service-card__cta">Ver más →</span>
              </div>
            </div>
          </a>
        </article>

      </div>
    </section>
  </main>

</body>
</html>
